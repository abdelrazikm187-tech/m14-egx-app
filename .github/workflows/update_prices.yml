name: M14 Motor - Update Prices
on:
  schedule:
    - cron: '*/5 8-13 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python update_engine.py
      - run: |
          git config user.name "M14 Motor"
          git config user.email "motor@m14.eg"
          git add data/live_prices.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Live prices update"
          git push
